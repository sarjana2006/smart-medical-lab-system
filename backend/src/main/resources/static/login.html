<!DOCTYPE html>
<html>
<head>
    <title>Patient Login</title>
</head>
<body>

    <h2>Patient Login</h2>

    <form action="/patient/login" method="post">

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>
        <br><br>

        <button type="submit">Login</button>

    </form>

</body>
</html>
